# Tutorial 1 - pricing only.
# Materials are abundant and nearly free (huge lots, zero reserve), so the
# auction and production phases take care of themselves. The only thing that
# decides the winner is the price you list WIDGET at: too high and the BUDGET
# half of the crowd walks away, too low and you leave money on the table.
turns: 20
seed: 1

initial_state:
  starting_capital: 5000.0
  initial_inventory:
    WIDGET: 20

suppliers:
  PART:
    production_min: 400
    production_max: 400
    base_price: 1.0
    stock_capacity: 2000
    price_stock_factor: 0.0
    price_floor_multiplier: 1.0
    adaptation:
      enabled: false
      low_stock_consecutive_turns: 3
      high_stock_consecutive_turns: 5
      empty_stock_percentage: 0.05
      full_stock_percentage: 0.95
      increase_percentage: 0.10
      decrease_percentage: 0.10

production:
  capacity_per_turn: null

consumer_market:
  base_customers: 40
  amplitude: 0
  period_divisor: 5.0
  price_sensitivity_beta: 0.02
  segments:
    BUDGET:
      share: 0.6
      preferences: { WIDGET: 1 }
      willingness_to_pay:
        WIDGET: [40.0, 70.0]
    PREMIUM:
      share: 0.4
      preferences: { WIDGET: 1 }
      willingness_to_pay:
        WIDGET: [90.0, 160.0]

goods:
  raw_materials: [PART]
  finished_goods: [WIDGET]
  recipes:
    RECIPE_WIDGET:
      output_good: WIDGET
      inputs: { PART: 2 }

agents:
  directory: src/dme_simulator/agents
  decide_timeout_ms: 10.0
  observe_all_transactions: false

output:
  directory: outputs/tutorial_pricing
  prefix: tutorial
  render_plots: true
  progress_interval_turns: 5
  # terminal | window | none. `--ui` and `--turn-delay` override these; the
  # delay holds each turn on screen so a viewer can follow the run live.
  dashboard: terminal
  turn_delay_seconds: 0.0
